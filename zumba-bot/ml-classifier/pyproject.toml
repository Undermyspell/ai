[project]
name = "ml-classifier"
version = "0.1.0"
description = "Stammtisch-Nachrichten-Klassifikator (Zusage/Absage/invalid) — Training & Evaluation"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "joblib>=1.4",
]

[dependency-groups]
embeddings = [
    "sentence-transformers>=3.0",
]
