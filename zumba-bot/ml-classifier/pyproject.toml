[project]
name = "ml-classifier"
version = "0.1.0"
description = "Stammtisch-Nachrichten-Klassifikator (Zusage/Absage/invalid) — Training & Evaluation"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.9",
    "pandas>=3.0",
    "psycopg2-binary>=2.9.12",
    "joblib>=1.5",
]

[dependency-groups]
embeddings = [
    "sentence-transformers>=5.6",
]
