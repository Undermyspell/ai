# Staging environment overrides
# Inherits from: environments/base/values.yaml

namespace: zumba-staging

n8n:
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  persistence:
    size: 2Gi
  
  env:
    N8N_SECURE_COOKIE: "false"

postgres:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  persistence:
    size: 2Gi
  
  # Enable external access on port 5433
  externalAccess:
    enabled: true
    port: 5433

  # Wöchentliches Backup nach Google Drive (Freitag 01:00, siehe Chart-Defaults)
  backup:
    enabled: true
    remotePath: "gdrive:zumba-backups/staging"

evolutionApi:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  persistence:
    size: 1Gi

evolutionApiIngress:
  host: evolution-stage.192.168.178.46.nip.io

ingress:
  host: zumba-stage.192.168.178.46.nip.io

# whatsapp-bot aktivieren mit dem lokal in den k3s-containerd importierten Image.
# IfNotPresent + exakter Name -> k3s nutzt das lokale Image ohne Registry-Pull.
whatsappBot:
  enabled: true
  image:
    repository: zumba-whatsapp-bot
    tag: "0.3.5"
    pullPolicy: IfNotPresent
  env:
    # Gruppen-"statistik" antwortet als Bild-Karte (Fallback Text)
    STATS_FORMAT: image
    # Diese fünf Designs sind im Umlauf: "statistik" zufällig, Wochenreport
    # der Reihe nach (jedes Design einmal je fünf Wochen)
    CARD_STYLES: "wrapped,bierdeckel,zeitung,arena,formular"
  weeklyReport:
    enabled: true
    # Wochenreport ebenfalls als Bild-Karte
    format: image

# Statistik-Bild-Karte (HTML → PNG via headless Chromium). Auf true setzen,
# sobald das zumba-renderer-Image auf dem Pi gebaut/importiert ist — der Bot
# bekommt dann automatisch RENDERER_URL und kann ?format=image.
renderer:
  enabled: true
  image:
    repository: zumba-renderer
    tag: "0.1.0"
    pullPolicy: IfNotPresent

# ML-Klassifikator im Shadow-Modus (Bot loggt Gemini vs. Modell in ml_messages).
classifier:
  enabled: true
  image:
    repository: zumba-classifier
    tag: "0.1.2"
    pullPolicy: IfNotPresent

# admin-ui aktivieren (lokales Image; BOT_URL zeigt per ConfigMap auf den Bot).
adminUi:
  enabled: true
  image:
    repository: zumba-admin-ui
    tag: "0.3.2"
    pullPolicy: IfNotPresent
  ingress:
    host: zumba-admin-stage.192.168.178.46.nip.io

wrapped:
  enabled: true
  image:
    repository: zumba-wrapped
    tag: "0.1.2"
    pullPolicy: IfNotPresent
  ingress:
    host: zumba-wrapped-stage.192.168.178.46.nip.io
