apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-extras
  namespace: argocd
  labels:
    app.kubernetes.io/name: traefik-extras
    app.kubernetes.io/managed-by: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Undermyspell/ai.git
    targetRevision: HEAD
    path: zumba-bot/deployment/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false      # Safety: Dashboard-Route nie automatisch löschen
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
