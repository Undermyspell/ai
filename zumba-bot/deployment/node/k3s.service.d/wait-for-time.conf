# Der Pi 5 hat keine RTC-Batterie: nach dem Boot steht die Uhr auf 1970 bzw. auf
# der von systemd restaurierten letzten bekannten Zeit, bis timesyncd sie per NTP
# nach vorne springen laesst. Startet k3s vor diesem Sprung, berechnet der
# CronJob-Controller seine Requeue-Delays gegen die falsche Uhr und legt sie in
# monotone Timer -- der spaetere Zeitsprung verkuerzt die nicht mehr. Folge: alle
# CronJobs feuern um den Sprung verspaetet (2026-08-27: Wochenreport und
# Postgres-Backup uebersprungen).
[Unit]
After=time-sync.target
Wants=time-sync.target
