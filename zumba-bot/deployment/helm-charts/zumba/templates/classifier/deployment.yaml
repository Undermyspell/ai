{{- if .Values.classifier.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zumba.fullname" . }}-classifier
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zumba.classifier.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "zumba.classifier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zumba.classifier.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: classifier
        image: "{{ .Values.classifier.image.repository }}:{{ .Values.classifier.image.tag }}"
        imagePullPolicy: {{ .Values.classifier.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          {{- toYaml .Values.classifier.resources | nindent 10 }}
{{- end }}
