{{- if .Values.renderer.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zumba.fullname" . }}-renderer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zumba.renderer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.renderer.service.type }}
  ports:
    - port: {{ .Values.renderer.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "zumba.renderer.selectorLabels" . | nindent 4 }}
{{- end }}
