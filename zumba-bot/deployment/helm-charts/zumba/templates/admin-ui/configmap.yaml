{{- if .Values.adminUi.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zumba.fullname" . }}-admin-ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zumba.adminUi.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.adminUi.service.port | quote }}
  DB_HOST: {{ include "zumba.fullname" . }}-postgres
  DB_PORT: {{ .Values.adminUi.env.DB_PORT | quote }}
  DB_NAME: {{ .Values.adminUi.env.DB_NAME | quote }}
  DB_USER: {{ .Values.adminUi.env.DB_USER | quote }}
  DB_SSLMODE: {{ .Values.adminUi.env.DB_SSLMODE | quote }}
  TZ: {{ .Values.adminUi.env.TZ | quote }}
  # Login: Benutzername im Klartext, Passwort und Session-Schlüssel kommen aus
  # dem SealedSecret (siehe deployment.yaml).
  ADMIN_USER: {{ .Values.adminUi.auth.user | quote }}
  COOKIE_SECURE: {{ .Values.adminUi.auth.cookieSecure | quote }}
  BOT_URL: http://{{ include "zumba.fullname" . }}-whatsapp-bot:{{ .Values.whatsappBot.service.port }}
  {{- if .Values.classifier.enabled }}
  # Manueller ML-Test: Admin-UI ruft den classifier-service direkt
  CLASSIFIER_URL: http://{{ include "zumba.fullname" . }}-classifier:{{ .Values.classifier.service.port }}
  {{- end }}
  {{- if .Values.ngrok.enabled }}
  # Öffentlich-Schalter: das Admin-UI redet mit dem tunnel-service, nie mit der
  # ngrok-Agent-API selbst (die kann zu viel, siehe tunnel-service/README.md).
  TUNNEL_URL: http://{{ include "zumba.fullname" . }}-ngrok:{{ .Values.ngrok.service.port }}
  {{- end }}
{{- end }}
